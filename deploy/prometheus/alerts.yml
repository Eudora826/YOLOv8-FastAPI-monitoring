# Alerting rules.
#
# Principle: alert on symptoms, not causes. CPU at 100% that no user can feel
# is noise; CPU at 30% while every request times out is a fire the CPU alert
# would miss entirely. Every rule here has to answer one question — when this
# fires, is a user actually affected?
#
# Every rule carries a `for`. Metrics are naturally jittery, and without a
# duration you get woken at 3am by noise, after which you mute the alert, and
# then the alerting system is dead. That failure mode has a name: alert fatigue.
#
# Thresholds come from a measured baseline (yolov8n on CPU, 20 samples):
# inference p95 is about 86 ms. See app/metrics.py.

groups:
  # -----------------------------------------------------------------
  # Recording rules: precompute the expressions used in several places.
  # Naming convention is level:metric:operation.
  # -----------------------------------------------------------------
  - name: yolo-recording
    interval: 15s
    rules:
      # `or vector(0)` is load-bearing, not decoration. With no 5xx at all the
      # numerator matches no series and returns an *empty vector*, not zero,
      # and an empty vector in a division stays empty. Without it this rule —
      # and the panel built on it — reads "No data" exactly when the service
      # is healthiest, which looks indistinguishable from broken.
      - record: job:http_error_rate:ratio5m
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0))
            /
          sum(rate(http_requests_total[5m]))

      - record: job:inference_duration_seconds:p95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(inference_duration_seconds_bucket{source="image"}[5m])) by (le)
          )

      - record: job:detections_per_image:mean5m
        expr: |
          rate(detections_per_image_sum[5m])
            /
          rate(detections_per_image_count[5m])

  - name: yolo-alerts
    rules:
      # ---------------------------------------------------------------
      # Service unreachable. `up` is synthesised by Prometheus itself:
      # 1 when the scrape succeeded, 0 when it did not — the liveness
      # signal comes free with the pull model.
      #
      # Only 2 minutes of `for`: a dead service is the most urgent symptom
      # there is and does not need lengthy confirmation.
      # ---------------------------------------------------------------
      - alert: ServiceDown
        expr: up{job="yolo-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "YOLO service is unreachable ({{ $labels.instance }})"
          description: >-
            Prometheus has failed to scrape {{ $labels.instance }}/metrics for
            2 minutes. The service has most likely crashed or lost networking.

      # ---------------------------------------------------------------
      # 5xx only. A 4xx means the client sent something invalid and the
      # service correctly rejected it — that is the service working, not
      # failing, and it should wake nobody.
      # ---------------------------------------------------------------
      - alert: HighErrorRate
        expr: job:http_error_rate:ratio5m > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate is {{ $value | humanizePercentage }} (threshold 5%)"
          description: >-
            Server-side errors have stayed above 5% for five minutes. Users
            are getting failed requests right now.

      # ---------------------------------------------------------------
      # Baseline p95 is ~86 ms; the threshold is 500 ms, roughly 6x headroom.
      # That much slack absorbs container overhead and CPU contention so only
      # real degradation fires. Picking a round-looking number instead of
      # deriving one from the baseline is the classic beginner mistake here.
      # ---------------------------------------------------------------
      - alert: InferenceLatencyHigh
        expr: job:inference_duration_seconds:p95 > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Inference p95 is {{ $value | humanizeDuration }} (baseline ~86ms, threshold 500ms)"
          description: >-
            The model has slowed down materially. Sort traces by duration in
            Jaeger to see whether inference itself or image decoding regressed.

      # ---------------------------------------------------------------
      # Backlog is only visible through a gauge. The request that submits a
      # job always returns in tens of milliseconds, so fifty jobs can be
      # piled up behind it while request latency looks perfectly calm.
      # ---------------------------------------------------------------
      - alert: VideoJobBacklog
        expr: video_jobs_active > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} video jobs have been queued for 15 minutes"
          description: >-
            Background jobs are arriving faster than they are being consumed.
            Single-process BackgroundTasks cannot scale out; a real job queue
            is the next step.

      # ---------------------------------------------------------------
      # Job failures are invisible in the HTTP metrics: POST /videos already
      # returned 202, and the failure happens afterwards, so no request ever
      # produces a 5xx.
      #
      # The trailing `and` stops a single failure from firing this when the
      # sample size is tiny.
      # ---------------------------------------------------------------
      - alert: VideoJobFailureRate
        expr: |
          (
            sum(rate(video_jobs_total{status="failed"}[15m]))
              /
            sum(rate(video_jobs_total[15m]))
          ) > 0.2
          and
          sum(rate(video_jobs_total[15m])) > 0.002
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Video job failure rate is {{ $value | humanizePercentage }} (threshold 20%)"
          description: >-
            Background annotation jobs are failing in bulk. This failure mode
            emits no 5xx anywhere; this metric is the only thing that sees it.

      # ---------------------------------------------------------------
      # Data drift sentinel. Normal traffic yields 3-5 objects per image;
      # dropping below 0.5 means something upstream changed — a dead camera,
      # a swapped model file, a misconfigured threshold.
      #
      # Latency is fine and the error rate is zero during this failure. Only
      # a business metric can catch it.
      #
      # The `and` clause requires enough traffic to judge, so an idle service
      # does not trigger it.
      # ---------------------------------------------------------------
      - alert: DetectionRateCollapse
        expr: |
          job:detections_per_image:mean5m < 0.5
          and
          rate(detections_per_image_count[5m]) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Only {{ $value | printf \"%.2f\" }} objects detected per image"
          description: >-
            Detections collapsed while the service itself reports no errors.
            Check the input source and which weights are loaded (see the
            model_info metric).

      # ---------------------------------------------------------------
      # Throttling at volume: either someone is hammering the service, or
      # the limit is configured too tightly. severity is info — worth a
      # look, not worth an interruption.
      # ---------------------------------------------------------------
      - alert: RateLimitingActive
        expr: sum(rate(rate_limited_requests_total[5m])) > 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Rate limiter is rejecting {{ $value | printf \"%.2f\" }} requests/s"
          description: >-
            A client keeps hitting the limit. Decide whether this is abnormal
            traffic or RATE_LIMIT_PER_MINUTE being set too low.
